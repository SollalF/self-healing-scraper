[project]
name = "self-healing-scraper"
version = "0.3.0"
description = "Generic self-healing declarative web scraper engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "SollalF" },
]
keywords = ["scraping", "self-healing", "crawl4ai", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.7.0",
    "openai>=2.48.0",
    "pydantic>=2.0.0,<3",
    "typing-extensions>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/SollalF/self-healing-scraper"
Repository = "https://github.com/SollalF/self-healing-scraper"
Issues = "https://github.com/SollalF/self-healing-scraper/issues"
Changelog = "https://github.com/SollalF/self-healing-scraper/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_healing_scraper"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["self_healing_scraper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["./src"]
python-version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
